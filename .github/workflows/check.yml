name: Verify static farm
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - name: Install pinned Hugo from official release
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_0.166.0_linux-amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
          "$RUNNER_TEMP/hugo" --minify
          node scripts/check-site.mjs
          FARM_HUGO="$RUNNER_TEMP/hugo" node scripts/check-archive-fixture.mjs
