title: 秋秋农场日报
baseURL: https://farm.aibioo.cn/
timezone: Asia/Shanghai
enableRobotsTXT: true
enableEmoji: true
hasCJKLanguage: true
theme: hextra
defaultContentLanguage: zh
outputs:
  home: [html, rss, json]
  page: [html]
  section: [html, rss]
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
menu:
  main:
    - identifier: ai-radar
      name: 农业雷达
      pageRef: /radar
      weight: 10
    - identifier: ai-timeline
      name: 农业时间线
      pageRef: /timeline
      weight: 20
    - identifier: documentation
      name: 农场日报
      pageRef: /
      weight: 30
    - identifier: knowledge
      name: 种植知识
      pageRef: /knowledge
      weight: 40
    - identifier: tools
      name: 工具
      pageRef: /tools
      weight: 50
    - identifier: sources
      name: 信息源
      pageRef: /sources
      weight: 60
    - identifier: ai-opportunity
      name: 应用机会
      pageRef: /opportunities
      weight: 70
    - identifier: search
      name: 搜索
      weight: 100
      params:
        type: search
params:
  description: 每天几分钟，看看农业AI、种菜技巧与田园生活，有什么值得自己试。
  author:
    name: 秋秋农场日报
    bio: 为向往田园生活、自给自足的普通读者筛选真实来源。
    website: https://farm.aibioo.cn/
  publisher:
    type: Organization
    name: 秋秋农场日报
    url: https://farm.aibioo.cn/
  displayUpdatedDate: true
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/sprout.svg
      width: 30
      height: 30
  footer:
    displayCopyright: false
    displayPoweredBy: false
  page:
    width: wide
  theme:
    default: light
    displayToggle: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  comments:
    enable: false